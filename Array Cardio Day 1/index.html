        { first: "Leonardo", last: "da Vinci", year: 1952, passed: 2000 },
        { first: "Eli", last: "Whitney", year: 1765, passed: 1825 },
        { first: "James", last: "Watt", year: 1736, passed: 1819 },
        { first: "Johannes", last: "Gutenberg", year: 1900, passed: 1968 },
        { first: "Benjamin", last: "Franklin", year: 1906, passed: 1790 },
        { first: "Samuel", last: "Morse", year: 1791, passed: 1872 },
        { first: "Marie", last: "Curie", year: 1867, passed: 1934 },

        { first: "Wright", last: "Brothers", year: 1871, passed: 1948 },
        { first: "Mark", last: "Dean", year: 1927, passed: 1968 },
        { first: "Garrett", last: "Morgan", year: 1877, passed: 1963 },
        { first: "Grace", last: "Hopper", year: 1906, passed: 1992 },

      const people = [

      ];

      // Array.prototype.filter()
      // 1. Filter the list of inventors for those who were born in the 1900's
      const fifteen = inventors.filter(
        (inventor) => inventor.year >= 1900 && inventor.year < 2000
      );
      console.table(fifteen);

      // Array.prototype.map()
      // 2. Give us an array of the inventors first and last names
      const fullNames = inventors.map(
        (inventor) => `${inventor.first} ${inventor.last}`
      );
      console.log(fullNames);

      // Array.prototype.sort()
      // 3. Sort the inventors by birthdate, oldest to youngest
      const order = inventors.sort((a, b) => a.year - b.year);
      console.table(order);

      // Array.prototype.reduce()
      // 4. How many years did all the inventors live all together?
      const totalYears = inventors.reduce((total, inventor) => {
        return total + (inventor.passed - inventor.year);
      }, 0);
      console.log(totalYears);

      // 5. Sort the inventors by years lived
      const oldest = inventors.sort((a, b) => {
        const lastInventor = a.passed - a.year;
        const nextInventor = b.passed - b.year;
        return lastInventor > nextInventor ? -1 : 1;
      });
      console.table(oldest);

      // 6. create a list of Boulevards in Paris that contain 'de' anywhere in the name

      // 7. sort Exercise
      // Sort the people alphabetically by last name
      const sortedPeople = people.sort((a, b) => {
        const [aLast] = a.split(", ");
        const [bLast] = b.split(", ");
        return aLast.localeCompare(bLast);
      });
      console.log(sortedPeople);

      // 8. Reduce Exercise
      // Sum up the instances of each of these
      const vehicles = [
        "car",
        "car",
        "truck",
        "truck",
        "bike",
        "walk",
        "car",
        "van",
        "bike",
        "walk",
        "car",
        "van",
        "car",
        "truck",
      ];
      const transportation = vehicles.reduce(function (obj, vehicle) {
        if (!obj[vehicle]) {
          obj[vehicle] = 0;
        }
        obj[vehicle]++;
        return obj;
      }, {});

      console.log(transportation);
